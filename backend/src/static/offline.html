<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14868C">
<title>PinkShieldAI — Offline</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f0fafa;
    color: #333;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem;
  }
  .container { text-align: center; max-width: 420px; }
  .icon { font-size: 3rem; margin-bottom: 1rem; }
  h1 { font-size: 1.5rem; color: #14868C; margin-bottom: 0.75rem; }
  p { font-size: 1rem; line-height: 1.6; margin-bottom: 1.5rem; color: #555; }
  button {
    background: linear-gradient(135deg, #14868C, #0f6b70);
    color: #fff;
    border: none;
    padding: 0.75rem 1.5rem;
    border-radius: 24px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { transform: scale(1.03); }
</style>
</head>
<body>
<div class="container">
  <div class="icon">&#128268;</div>
  <h1>You're Offline</h1>
  <p>PinkShieldAI needs an internet connection to run the risk assessment. Please check your connection and try again.</p>
  <button onclick="window.location.reload()">Retry</button>
</div>
</body>
</html>
